# Standard SpringDoc (OpenAPI) settings for all services
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
springdoc.use-management-port=false

# Standard Logging levels
logging.level.root=INFO
logging.level.com.app=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Standard Resilience4j Timeouts (15s for cold start reliability)
resilience4j.timelimiter.configs.default.timeoutDuration=15s
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.slidingWindowSize=20

# Standard JPA/MVC settings
spring.mvc.servlet.load-on-startup=1
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
